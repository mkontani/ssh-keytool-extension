name: Auto Release on Manifest Version Bump

on:
  push:
    branches: [main]
    paths:
      - 'public/manifest.json'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: meta
        run: |
          VERSION=$(node -p "require('./public/manifest.json').version")
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag ${TAG} already exists; skipping release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag ${TAG} not found; will create release."
          fi

  release:
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Zip extension
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          cd dist
          zip -r "../ssh-keytool-extension-${TAG}.zip" .
          cd ..

      - name: Create release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            "ssh-keytool-extension-${TAG}.zip"

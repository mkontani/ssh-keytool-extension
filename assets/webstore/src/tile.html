<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store promo tile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
<!--
  Chrome Web Store promo tiles: deep navy, circuit traces echoing the logo,
  and the logo cut out of its flat background with a teal glow.
  Usage: tile.html?size=small (440x280) | tile.html?size=marquee (1400x560)
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { overflow: hidden; }
  body {
    font-family: Inter, system-ui, sans-serif; position: relative;
    background: radial-gradient(80% 120% at 50% 40%, #12335f 0%, #0a1a33 55%, #060e1d 100%);
  }
  body.small { width: 440px; height: 280px; }
  body.marquee { width: 1400px; height: 560px; }
  svg.traces { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { filter: drop-shadow(0 0 28px rgba(45, 212, 191, .45)); }
  .name { font-weight: 800; letter-spacing: -0.02em; color: #fff; }
  .tag { font-weight: 600; color: #8fe9dc; }
  .small .wrap { gap: 16px; }
  .small canvas { width: 150px; height: 150px; }
  .small .name { font-size: 36px; }
  .marquee .wrap { gap: 40px; }
  .marquee canvas { width: 340px; height: 340px; }
  .marquee .name { font-size: 96px; }
  .marquee .tag { font-size: 30px; margin-top: 10px; }
</style>
</head>
<body>
<script>
const size = new URLSearchParams(location.search).get('size') === 'marquee' ? 'marquee' : 'small';
document.body.className = size;
const [W, H] = size === 'marquee' ? [1400, 560] : [440, 280];
const LOGO_PX = 1024;

function traces() {
  // Deterministic pseudo-random traces so re-renders are identical.
  const big = size === 'marquee';
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const parts = [];
  for (let i = 0; i < (big ? 34 : 14); i++) {
    let x = rnd() * W, y = rnd() * H;
    const pts = [[x, y]];
    for (let s = 0; s < 3; s++) {
      const len = (big ? 60 : 24) + rnd() * (big ? 140 : 50);
      const dir = Math.floor(rnd() * 4);
      if (dir === 0) x += len; else if (dir === 1) x -= len;
      else if (dir === 2) { x += len * .7; y += len * .7; } else { x -= len * .7; y -= len * .7; }
      pts.push([x, y]);
    }
    const d = pts.map((p, j) => `${j ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
    const [ex, ey] = pts[pts.length - 1];
    const op = 0.10 + rnd() * 0.18;
    const sw = big ? 3 : 1.6;
    parts.push(
      `<path d="${d}" stroke="#2dd4bf" stroke-opacity="${op.toFixed(2)}" stroke-width="${sw}" fill="none"/>`,
      `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="${big ? 7 : 3.2}" stroke="#2dd4bf" stroke-opacity="${(op * 1.6).toFixed(2)}" stroke-width="${sw}" fill="none"/>`
    );
  }
  return `<svg class="traces" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${parts.join('')}</svg>`;
}

document.body.insertAdjacentHTML('afterbegin', `${traces()}
  <div class="wrap">
    <canvas id="logo" width="${LOGO_PX}" height="${LOGO_PX}"></canvas>
    <div><div class="name">SSH Keytool</div>${size === 'marquee' ? '<div class="tag">SSH keys, offline in your browser</div>' : ''}</div>
  </div>`);

async function cutOutLogo(canvas) {
  // Make the logo's flat off-white background transparent by flood-filling from
  // the border, so enclosed whites (keyhole, key blade) are kept.
  const img = new Image();
  img.src = '../../logo.png';
  await img.decode();
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, LOGO_PX, LOGO_PX);
  const px = data.data;
  const bg = [px[0], px[1], px[2]];
  const dist = i => Math.hypot(px[i] - bg[0], px[i + 1] - bg[1], px[i + 2] - bg[2]);
  const seen = new Uint8Array(LOGO_PX * LOGO_PX);
  const stack = [];
  for (let i = 0; i < LOGO_PX; i++) {
    stack.push(i, (LOGO_PX - 1) * LOGO_PX + i, i * LOGO_PX, i * LOGO_PX + LOGO_PX - 1);
  }
  while (stack.length) {
    const p = stack.pop();
    if (seen[p]) continue;
    seen[p] = 1;
    const d = dist(p * 4);
    if (d > 70) continue;
    // Soft edge: near-background pixels fade out instead of a hard cut.
    px[p * 4 + 3] = Math.round(255 * Math.min(1, Math.max(0, (d - 14) / 56)));
    const x = p % LOGO_PX, y = (p / LOGO_PX) | 0;
    if (x > 0) stack.push(p - 1);
    if (x < LOGO_PX - 1) stack.push(p + 1);
    if (y > 0) stack.push(p - LOGO_PX);
    if (y < LOGO_PX - 1) stack.push(p + LOGO_PX);
  }
  ctx.putImageData(data, 0, 0);
}

(async () => {
  await cutOutLogo(document.getElementById('logo'));
  await document.fonts.ready;
  await new Promise(r => setTimeout(r, 150));
  document.body.dataset.ready = 'true';
})();
</script>
</body>
</html>
